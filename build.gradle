plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.modDevGradle
    alias libs.plugins.lombok
}

group = maven_group
boolean isSnapshot = System.getenv("SNAPSHOT")
version = "${mod_version}" + (isSnapshot ? "-SNAPSHOT" : "")
boolean isCI = System.getenv("CI") != null

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    // Include resources generated by data generators.
    main.java {
        exclude 'com/jerry/mekmm/client/recipe_viewer/emi/**'
        exclude 'com/jerry/mekmm/common/integration/crafttweaker/**'
        exclude 'com/jerry/mekmm/mixin/client/recipe_viewer/MixinMekanismEmi.java'
        exclude 'com/jerry/mekmm/mixin/client/render/MixinRenderTickHandler.java'
    }

    main.resources {
        srcDir 'src/generated/resources'
    }

    client {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    test {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    extra {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    clientExtra {
        compileClasspath += client.output + extra.compileClasspath
        runtimeClasspath += client.output + client.runtimeClasspath + extra.runtimeClasspath
    }
}

configurations {
    // set these as unresolvable so we don't accidentally force all dependents to use them with us
    clientRuntimeOnly.canBeResolved = false
    extraRuntimeOnly.canBeResolved = false
    clientExtraRuntimeOnly.canBeResolved = false

    runtimeClasspath.extendsFrom localRuntime
    extraRuntimeClasspath.extendsFrom extraLocalRuntime
    clientRuntimeClasspath.extendsFrom clientLocalRuntime
    extraClientRuntimeClasspath.extendsFrom clientExtraLocalRuntime
}

apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/dependencies.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"



tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << '-Xmaxerrs' << '2000'
    options.compilerArgs << "-Xlint:-removal"
}

lombok {
    version = "1.18.46"
}

tasks.named('jar', Jar) {
 archiveFileName = 'mekmm-26.1.2-2.0.0-port5-atm11-0.9.0.jar'
 from('LICENSE') { into 'META-INF'; rename { 'LICENSE-MoreMachine' } }
}

if (providers.gradleProperty('moreMachineSmoke').isPresent()) {
 sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
 neoForge.runs.server.systemProperty 'port.moreMachineSmoke', 'true'
}
tasks.named('downloadAssets') {
 javaExecutable.set(javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.map { it.executablePath.asFile.absolutePath })
}

if (providers.gradleProperty('clientIntegration').isPresent()) {
 neoForge.runs.configureEach { systemProperty 'port.clientIntegration', 'true' }
 neoForge.runs.client.programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25567'
}
tasks.withType(Test).configureEach { failOnNoDiscoveredTests = false }

